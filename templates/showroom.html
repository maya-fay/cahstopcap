<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CahStopCap - Showroom</title>
  <link rel="icon" type="image/png" href="/static/logo.png" />
  <link rel="apple-touch-icon" href="/static/logo.png" />
  <link rel="stylesheet" href="static/styles.css" />
  <link rel="stylesheet" href="static/showroom.css" />
</head>
<body class="index">

  <!-- HEADER -->
  <header>
    <nav class="header-nav">
      <div class="nav-item">
        <span class="nav-text"><a href="/showroom">Shop</a></span>
        <span class="nav-icon"><a href="/showroom"><span class="nav-emoji" aria-label="Shop">🧢</span></a></span>
      </div>
      <div class="nav-item">
        <span class="nav-text"><a href="#about">About</a></span>
        <span class="nav-icon"><a href="#about"><span class="nav-emoji" aria-label="About">ℹ️</span></a></span>
      </div>
      <div class="nav-item">
        <span class="nav-text"><a href="/contact">Contact</a></span>
        <span class="nav-icon"><a href="/contact"><span class="nav-emoji" aria-label="Contact">✉️</span></a></span>
      </div>
      <div class="nav-item">
        <span class="nav-text"><a href="/cart" class="nav-cart-link">Cart <span class="cart-count-badge">0</span></a></span>
        <span class="nav-icon"><a href="/cart" class="nav-cart-link"><span class="cart-emoji">🛒</span><span class="cart-count-badge">0</span></a></span>
      </div>
    </nav>
    <div class="header-logo">
      <a href="/"><img src="/static/logo.png" alt="CahStopCap Logo"></a>
    </div>
  </header>

  <!-- MARQUEE -->
  <div class="marquee">
    <span> YDYS | YOU DEFINE YOUR SWAG | YDYS </span>
  </div>

  <!-- SHOWROOM SECTION -->
  <section class="showroom-page">
    <h2 class="showroom-header">SHOWROOM</h2>

    <!-- Category Filter -->
    <div class="filter-bar" id="filterBar"></div>

    <!-- Hat Grid -->
    <div class="hat-grid" id="hatGrid">
      <p class="loading-state">Loading hats...</p>
    </div>

    <!-- No Results -->
    <div id="noResults" class="no-results">
      No hats found in this category.
    </div>
  </section>

  <!-- TOAST -->
  <div id="toast" class="toast"></div>

  <!-- FOOTER -->
  <footer>
    <div class="footer-info">
      <div>
        <h4>Find Us</h4>
        <p>Based in Kingston<br />Operating on the campuses of UWI and UTECH</p>
      </div>
      <div>
        <h4>Contact</h4>
        <div class="footer-social">
          <a href="mailto:cahstopcap@gmail.com" class="footer-icon-link" aria-label="Email us">
            <svg viewBox="0 0 24 24" class="email-icon" fill="none" xmlns="http://www.w3.org/2000/svg">
              <rect x="2" y="4" width="20" height="16" rx="2" stroke="white" stroke-width="1.6"/>
              <path d="M3 6.5L12 13L21 6.5" stroke="white" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </a>
          <a href="https://www.instagram.com/cahstopcap?igsh=MWJseGo2M2pxcWp1eg==" target="_blank" class="footer-icon-link">
            <img src="/static/assets/instagram.png" class="ig-logo" alt="Instagram" />
          </a>
        </div>
      </div>
    </div>
  </footer>

  <script>
    let activeCategory = 'all';
    let allHats = [];

    // ── Fetch all hats once, build filters from what's in stock ────────
    async function initShowroom() {
      const grid = document.getElementById('hatGrid');
      grid.innerHTML = '<p class="loading-state">Loading hats...</p>';

      try {
        const res = await fetch('/api/hats');
        if (!res.ok) throw new Error('Failed to fetch hats');
        allHats = await res.json();
      } catch (err) {
        grid.innerHTML = '<p class="loading-state">Could not load hats. Please try again.</p>';
        console.error(err);
        return;
      }

      renderFilterBar();
      renderHats(filterHats(activeCategory));
    }

    function renderFilterBar() {
      const bar = document.getElementById('filterBar');
      const categories = [...new Set(
        allHats.filter(h => h.stock_quantity > 0 && h.category).map(h => h.category)
      )].sort((a, b) => a.localeCompare(b));

      bar.innerHTML = '';
      bar.appendChild(createCategoryButton('all', 'All Hats'));
      categories.forEach(cat => {
        const label = cat.charAt(0).toUpperCase() + cat.slice(1);
        bar.appendChild(createCategoryButton(cat, label));
      });
    }

    function createCategoryButton(category, label) {
      const btn = document.createElement('button');
      btn.className = 'category-btn' + (category === activeCategory ? ' active' : '');
      btn.dataset.category = category;
      btn.textContent = label;
      btn.addEventListener('click', () => {
        document.querySelectorAll('.category-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        activeCategory = category;
        renderHats(filterHats(activeCategory));
      });
      return btn;
    }

    function filterHats(category) {
      if (!category || category === 'all') return allHats;
      return allHats.filter(h => h.category === category);
    }

    function renderHats(hats) {
      const grid = document.getElementById('hatGrid');
      const noResults = document.getElementById('noResults');

      grid.innerHTML = '';

      if (hats.length === 0) {
        noResults.style.display = 'block';
        return;
      }

      noResults.style.display = 'none';

      hats.forEach(hat => {
        const card = document.createElement('div');
        const outOfStock = hat.stock_quantity <= 0;
        card.className = 'hat-card' + (outOfStock ? ' out-of-stock' : '');

        const price = hat.price.toLocaleString('en-US', {
          style: 'currency',
          currency: 'USD',
          minimumFractionDigits: 0
        });

        const imgSrc = resolveImagePath(hat.image_url);

        card.innerHTML = `
          <div class="hat-card-image">
            <img src="${imgSrc}" alt="${hat.name}" loading="lazy" />
            ${outOfStock ? '<span class="out-of-stock-badge">Out of Stock</span>' : ''}
          </div>
          <div class="hat-card-info">
            <h3 class="hat-name">${hat.name}</h3>
            <p class="hat-price">${price}</p>
          </div>
          <div class="hat-card-actions">
            <button class="cart-button" data-hat-id="${hat.id}" ${outOfStock ? 'disabled' : ''}>Add to Cart</button>
            <a href="/hat/${hat.id}" class="more-details" ${outOfStock ? 'aria-disabled="true" tabindex="-1"' : ''}>View Details</a>
          </div>
        `;

        // Add to cart handler
        const cartBtn = card.querySelector('.cart-button');
        if (!outOfStock) {
          cartBtn.addEventListener('click', () => {
            const result = addToCart(hat.id, hat.stock_quantity);
            if (result === 'capped') {
              showToast(`Only ${hat.stock_quantity} of "${hat.name}" in stock`);
            } else {
              showToast(`${hat.name} added to cart`);
            }
          });
        }

        if (outOfStock) {
          card.querySelector('.more-details').addEventListener('click', (e) => e.preventDefault());
        }

        grid.appendChild(card);
      });
    }

    // ── Cart ─────────────────────────────────────────────────────────
    function resolveImagePath(url) {
      if (!url) return '/static/assets/placeholder.jpg';
      if (url.startsWith('http') || url.startsWith('/')) return url;
      return '/' + url;
    }

    function getCart() {
      return JSON.parse(localStorage.getItem('cart') || '{}');
    }

    function saveCart(cart) {
      localStorage.setItem('cart', JSON.stringify(cart));
      const count = Object.values(cart).reduce((sum, qty) => sum + qty, 0);
      document.querySelectorAll('.cart-count-badge').forEach(el => el.textContent = count);
    }

    function addToCart(hatId, stockQuantity) {
      const cart = getCart();
      const nextQty = (cart[hatId] || 0) + 1;
      const capped = nextQty > stockQuantity;
      cart[hatId] = Math.min(nextQty, stockQuantity);
      saveCart(cart);
      return capped ? 'capped' : 'added';
    }

    // ── Toast ────────────────────────────────────────────────────────
    let toastTimeout;
    function showToast(message) {
      const toast = document.getElementById('toast');
      toast.textContent = message;
      toast.classList.add('show');
      clearTimeout(toastTimeout);
      toastTimeout = setTimeout(() => toast.classList.remove('show'), 2200);
    }

    // ── Init ─────────────────────────────────────────────────────────
    saveCart(getCart());
    initShowroom();
  </script>
</body>
</html>
