<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CahStopCap - Owner Dashboard</title>
  <link rel="stylesheet" href="/static/styles.css" />
  <link rel="stylesheet" href="/static/admin.css" />
</head>
<body class="index admin-body">

  <header class="admin-header">
    <div class="admin-header-title">
      <a href="/"><img src="/static/logo.png" alt="CahStopCap Logo" class="admin-header-logo" /></a>
      <h1>Owner Dashboard</h1>
    </div>
  </header>

  <nav class="admin-tabs">
    <div class="admin-tabs-left">
      <button class="admin-tab-btn active" data-tab="orders">Orders</button>
      <button class="admin-tab-btn" data-tab="hats">Hats</button>
      <button class="admin-tab-btn" data-tab="carousel">Carousel</button>
    </div>
    <a href="/admin/logout" class="admin-logout-link">Log Out</a>
  </nav>

  <main class="admin-main">
    <!-- ORDERS TAB -->
    <section id="ordersTab" class="admin-tab-panel active">
      <div class="orders-board" id="ordersBoard">
        <div class="orders-column" data-status="placed">
          <h3>Placed</h3>
          <div class="orders-column-list" data-status-list="placed"></div>
        </div>
        <div class="orders-column" data-status="processing">
          <h3>Processing</h3>
          <div class="orders-column-list" data-status-list="processing"></div>
        </div>
        <div class="orders-column" data-status="out_for_delivery">
          <h3>Out for Delivery</h3>
          <div class="orders-column-list" data-status-list="out_for_delivery"></div>
        </div>
        <div class="orders-column" data-status="completed">
          <h3>Completed</h3>
          <div class="orders-column-list" data-status-list="completed"></div>
        </div>
      </div>
    </section>

    <!-- HATS TAB -->
    <section id="hatsTab" class="admin-tab-panel">
      <div class="hat-form-wrap">
        <h3>Add New Hat</h3>
        <form id="addHatForm" class="hat-form">
          <label>
            Name <span class="required-marker">*</span>
            <input type="text" name="name" required />
          </label>
          <label>
            Price <span class="required-marker">*</span>
            <input type="number" name="price" min="0" step="0.01" required />
          </label>
          <label>
            Brand
            <input type="text" name="brand" />
          </label>
          <label>
            Category
            <select name="category">
              <option value="">Select a category…</option>
              <option value="__new__">+ Add new category</option>
            </select>
          </label>
          <label id="newCategoryLabel" style="display:none;">
            New Category
            <input type="text" name="new_category" placeholder="e.g. Snapback" />
          </label>
          <label>
            Size
            <input type="text" name="size" />
          </label>
          <label>
            Color
            <input type="text" name="color" />
          </label>
          <label>
            Material
            <input type="text" name="material" />
          </label>
          <label class="hat-form-image-field">
            Image
            <input type="file" id="hatImageInput" accept="image/*" />
            <input type="hidden" name="image_url" id="hatImageUrl" />
            <span id="hatImageStatus" class="upload-status"></span>
            <img id="hatImagePreview" class="upload-preview" alt="Preview" style="display:none;" />
          </label>
          <label>
            Stock Quantity
            <input type="number" name="stock_quantity" min="0" step="1" value="0" />
          </label>
          <label class="hat-form-checkbox">
            <input type="checkbox" name="is_available" checked />
            Available in store
          </label>
          <button type="submit" class="hat-save-btn">Add Hat</button>
          <p id="addHatError" class="admin-form-error" style="display:none;"></p>
        </form>
      </div>

      <div class="hats-table-wrap">
        <table class="hats-table">
          <thead>
            <tr>
              <th>Image</th>
              <th>Name</th>
              <th>Brand</th>
              <th>Price</th>
              <th>Stock Qty</th>
              <th>Available</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="hatsTableBody">
            <tr><td colspan="7" class="admin-loading">Loading hats...</td></tr>
          </tbody>
        </table>
      </div>
    </section>

    <!-- CAROUSEL TAB -->
    <section id="carouselTab" class="admin-tab-panel">
      <div class="hat-form-wrap">
        <h3>Add New Slide</h3>
        <form id="addSlideForm" class="hat-form">
          <label class="hat-form-image-field">
            Image <span class="required-marker">*</span>
            <input type="file" id="slideImageInput" accept="image/*" />
            <input type="hidden" name="image_url" id="slideImageUrl" />
            <span id="slideImageStatus" class="upload-status"></span>
            <img id="slideImagePreview" class="upload-preview" alt="Preview" style="display:none;" />
          </label>
          <label class="hat-form-checkbox">
            <input type="checkbox" name="show_caption" id="slideShowCaption" checked />
            Include title &amp; button
          </label>
          <label id="slideTitleLabel">
            Large Text (Title) <span class="required-marker">*</span>
            <input type="text" name="title" required />
          </label>
          <label id="slideButtonTextLabel">
            Button Text
            <input type="text" name="button_text" placeholder="Shop Now" />
          </label>
          <label id="slideButtonLinkLabel">
            Button Link
            <input type="text" name="button_link" placeholder="/showroom" />
          </label>
          <label>
            Sort Order
            <input type="number" name="sort_order" step="1" value="0" />
          </label>
          <label class="hat-form-checkbox">
            <input type="checkbox" name="is_active" checked />
            Active on homepage
          </label>
          <button type="submit" class="hat-save-btn">Add Slide</button>
          <p id="addSlideError" class="admin-form-error" style="display:none;"></p>
        </form>
      </div>

      <div class="hats-table-wrap">
        <table class="hats-table">
          <thead>
            <tr>
              <th>Image</th>
              <th>Title</th>
              <th>Show Text</th>
              <th>Button Text</th>
              <th>Button Link</th>
              <th>Order</th>
              <th>Active</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="carouselTableBody">
            <tr><td colspan="8" class="admin-loading">Loading slides...</td></tr>
          </tbody>
        </table>
      </div>
    </section>
  </main>

  <script>
    const ORDER_STATUSES = ['placed', 'processing', 'out_for_delivery', 'completed'];
    const STATUS_LABELS = {
      placed: 'Placed',
      processing: 'Processing',
      out_for_delivery: 'Out for Delivery',
      completed: 'Completed'
    };

    function resolveImagePath(url) {
      if (!url) return '/static/assets/placeholder.jpg';
      if (url.startsWith('http') || url.startsWith('/')) return url;
      return '/' + url;
    }

    async function apiFetch(url, options) {
      const res = await fetch(url, options);
      if (res.status === 401) {
        window.location.href = '/admin/login';
        throw new Error('Not authenticated');
      }
      return res;
    }

    async function uploadImage(file) {
      const formData = new FormData();
      formData.append('file', file);
      const res = await apiFetch('/api/admin/upload-image', { method: 'POST', body: formData });
      const data = await res.json();
      if (!res.ok) throw new Error(data.detail || 'Could not upload image');
      return data.url;
    }

    function wireImageUpload({ fileInput, urlField, statusEl, previewEl }) {
      fileInput.addEventListener('change', async () => {
        const file = fileInput.files[0];
        if (!file) return;

        statusEl.textContent = 'Uploading...';
        try {
          const url = await uploadImage(file);
          urlField.value = url;
          previewEl.src = resolveImagePath(url);
          previewEl.style.display = 'block';
          statusEl.textContent = 'Uploaded';
        } catch (err) {
          statusEl.textContent = err.message;
        }
      });
    }

    // ── Tabs ─────────────────────────────────────────────────────────
    document.querySelectorAll('.admin-tab-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.admin-tab-btn').forEach(b => b.classList.remove('active'));
        document.querySelectorAll('.admin-tab-panel').forEach(p => p.classList.remove('active'));
        btn.classList.add('active');
        document.getElementById(btn.dataset.tab + 'Tab').classList.add('active');
      });
    });

    // ── Orders ───────────────────────────────────────────────────────
    async function loadOrders() {
      const res = await apiFetch('/api/admin/orders');
      const orders = await res.json();

      ORDER_STATUSES.forEach(status => {
        const list = document.querySelector(`[data-status-list="${status}"]`);
        list.innerHTML = '';
      });

      orders.forEach(order => {
        const list = document.querySelector(`[data-status-list="${order.status}"]`);
        if (!list) return;

        const card = document.createElement('div');
        card.className = 'order-card';

        const itemsHtml = order.items.map(i => `<li>${i.quantity} &times; ${i.hat_name}</li>`).join('');
        const createdDate = new Date(order.created_at).toLocaleString();

        const optionsHtml = ORDER_STATUSES.map(s =>
          `<option value="${s}" ${s === order.status ? 'selected' : ''}>${STATUS_LABELS[s]}</option>`
        ).join('');

        const fulfillmentLabel = order.fulfillment_type === 'delivery' ? 'Delivery' : 'Pickup';

        card.innerHTML = `
          <div class="order-card-header">
            <strong>#${order.id}</strong>
            <span>$${Number(order.total_price).toFixed(2)}</span>
          </div>
          <p class="order-customer">${order.customer_name}</p>
          <p class="order-date">${createdDate}</p>
          <p class="order-contact">${order.customer_email || ''}</p>
          <p class="order-contact">${order.customer_phone || ''}</p>
          ${order.instagram_handle ? `<p class="order-contact">${order.instagram_handle}</p>` : ''}
          <p class="order-fulfillment">${fulfillmentLabel}${order.fulfillment_type === 'delivery' && order.delivery_address ? `: ${order.delivery_address}` : ''}</p>
          <ul class="order-items">${itemsHtml}</ul>
          <select class="order-status-select" data-order-id="${order.id}">${optionsHtml}</select>
        `;

        card.querySelector('.order-status-select').addEventListener('change', (e) => {
          updateOrderStatus(order.id, e.target.value);
        });

        list.appendChild(card);
      });
    }

    async function updateOrderStatus(orderId, status) {
      const res = await apiFetch(`/api/admin/orders/${orderId}`, {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ status })
      });

      if (!res.ok) {
        alert('Could not update order status.');
      }

      loadOrders();
    }

    // ── Hats ─────────────────────────────────────────────────────────
    function populateCategoryOptions(hats) {
      const select = document.querySelector('#addHatForm select[name="category"]');
      const currentValue = select.value;
      const categories = [...new Set(hats.map(h => h.category).filter(Boolean))].sort();

      select.innerHTML = '<option value="">Select a category…</option>' +
        categories.map(c => `<option value="${c}">${c}</option>`).join('') +
        '<option value="__new__">+ Add new category</option>';

      if ([...select.options].some(o => o.value === currentValue)) {
        select.value = currentValue;
      }
    }

    async function loadHats() {
      const res = await apiFetch('/api/admin/hats');
      const hats = await res.json();
      populateCategoryOptions(hats);
      const tbody = document.getElementById('hatsTableBody');
      tbody.innerHTML = '';

      hats.forEach(hat => {
        const tr = document.createElement('tr');
        tr.dataset.hatId = hat.id;

        tr.innerHTML = `
          <td><img src="${resolveImagePath(hat.image_url)}" alt="${hat.name}" class="hats-table-image hats-table-image--lg" /></td>
          <td><input type="text" class="hat-field hat-field--name" data-field="name" value="${hat.name}" /></td>
          <td>${hat.brand || ''}</td>
          <td><input type="number" class="hat-field" data-field="price" value="${hat.price}" min="0" step="0.01" /></td>
          <td><input type="number" class="hat-field" data-field="stock_quantity" value="${hat.stock_quantity}" min="0" step="1" /></td>
          <td><input type="checkbox" class="hat-field" data-field="is_available" ${hat.is_available ? 'checked' : ''} /></td>
          <td><button class="hat-save-btn">Save</button></td>
        `;

        tr.querySelector('.hat-save-btn').addEventListener('click', () => saveHat(hat.id, tr));

        tbody.appendChild(tr);
      });
    }

    async function saveHat(hatId, row) {
      const payload = {
        name: row.querySelector('[data-field="name"]').value,
        price: parseFloat(row.querySelector('[data-field="price"]').value),
        stock_quantity: parseInt(row.querySelector('[data-field="stock_quantity"]').value, 10),
        is_available: row.querySelector('[data-field="is_available"]').checked
      };

      const btn = row.querySelector('.hat-save-btn');
      btn.textContent = 'Saving...';
      btn.disabled = true;

      try {
        const res = await apiFetch(`/api/admin/hats/${hatId}`, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        if (!res.ok) {
          const data = await res.json();
          throw new Error(data.detail || 'Could not save hat');
        }

        btn.textContent = 'Saved';
        setTimeout(() => { btn.textContent = 'Save'; btn.disabled = false; }, 1200);
      } catch (err) {
        alert(err.message);
        btn.textContent = 'Save';
        btn.disabled = false;
      }
    }

    // ── Add Hat ──────────────────────────────────────────────────────
    const hatCategorySelect = document.querySelector('#addHatForm select[name="category"]');
    const newCategoryLabel = document.getElementById('newCategoryLabel');
    hatCategorySelect.addEventListener('change', () => {
      const isNew = hatCategorySelect.value === '__new__';
      newCategoryLabel.style.display = isNew ? '' : 'none';
      if (!isNew) newCategoryLabel.querySelector('input').value = '';
    });

    wireImageUpload({
      fileInput: document.getElementById('hatImageInput'),
      urlField: document.getElementById('hatImageUrl'),
      statusEl: document.getElementById('hatImageStatus'),
      previewEl: document.getElementById('hatImagePreview'),
    });

    document.getElementById('addHatForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const form = e.target;
      const errorEl = document.getElementById('addHatError');
      errorEl.style.display = 'none';

      const name = form.name.value.trim();
      const price = parseFloat(form.price.value);

      if (!name) {
        errorEl.textContent = 'Name is required.';
        errorEl.style.display = 'block';
        return;
      }

      if (isNaN(price) || price < 0) {
        errorEl.textContent = 'Please enter a valid price.';
        errorEl.style.display = 'block';
        return;
      }

      const category = form.category.value === '__new__'
        ? form.new_category.value.trim()
        : form.category.value.trim();

      const payload = {
        name,
        price,
        brand: form.brand.value.trim() || null,
        category: category || null,
        size: form.size.value.trim() || null,
        color: form.color.value.trim() || null,
        material: form.material.value.trim() || null,
        image_url: form.image_url.value.trim() || null,
        stock_quantity: parseInt(form.stock_quantity.value, 10) || 0,
        is_available: form.is_available.checked,
      };

      const submitBtn = form.querySelector('button[type="submit"]');
      submitBtn.disabled = true;
      submitBtn.textContent = 'Adding...';

      try {
        const res = await apiFetch('/api/admin/hats', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        const data = await res.json();
        if (!res.ok) throw new Error(data.detail || 'Could not add hat');

        form.reset();
        form.is_available.checked = true;
        newCategoryLabel.style.display = 'none';
        document.getElementById('hatImageStatus').textContent = '';
        document.getElementById('hatImagePreview').style.display = 'none';
        loadHats();
      } catch (err) {
        errorEl.textContent = err.message;
        errorEl.style.display = 'block';
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Add Hat';
      }
    });

    // ── Carousel ─────────────────────────────────────────────────────
    async function loadCarousel() {
      const res = await apiFetch('/api/admin/carousel');
      const slides = await res.json();
      const tbody = document.getElementById('carouselTableBody');
      tbody.innerHTML = '';

      slides.forEach(slide => {
        const tr = document.createElement('tr');
        tr.dataset.slideId = slide.id;

        tr.innerHTML = `
          <td class="carousel-image-cell">
            <img src="${resolveImagePath(slide.image_url)}" alt="${slide.title}" class="hats-table-image" />
            <input type="hidden" class="hat-field" data-field="image_url" value="${slide.image_url}" />
            <input type="file" class="row-image-input" accept="image/*" />
            <span class="upload-status row-upload-status"></span>
          </td>
          <td><input type="text" class="hat-field" data-field="title" value="${slide.title}" /></td>
          <td><input type="checkbox" class="hat-field" data-field="show_caption" ${slide.show_caption ? 'checked' : ''} /></td>
          <td><input type="text" class="hat-field" data-field="button_text" value="${slide.button_text}" /></td>
          <td><input type="text" class="hat-field" data-field="button_link" value="${slide.button_link}" /></td>
          <td><input type="number" class="hat-field" data-field="sort_order" value="${slide.sort_order}" step="1" /></td>
          <td><input type="checkbox" class="hat-field" data-field="is_active" ${slide.is_active ? 'checked' : ''} /></td>
          <td>
            <button class="hat-save-btn">Save</button>
            <button type="button" class="hat-save-btn slide-delete-btn">Delete</button>
          </td>
        `;

        wireImageUpload({
          fileInput: tr.querySelector('.row-image-input'),
          urlField: tr.querySelector('[data-field="image_url"]'),
          statusEl: tr.querySelector('.row-upload-status'),
          previewEl: tr.querySelector('.hats-table-image'),
        });

        tr.querySelector('.hat-save-btn').addEventListener('click', () => saveSlide(slide.id, tr));
        tr.querySelector('.slide-delete-btn').addEventListener('click', () => deleteSlide(slide.id));

        tbody.appendChild(tr);
      });
    }

    async function saveSlide(slideId, row) {
      const payload = {
        image_url: row.querySelector('[data-field="image_url"]').value,
        title: row.querySelector('[data-field="title"]').value,
        show_caption: row.querySelector('[data-field="show_caption"]').checked,
        button_text: row.querySelector('[data-field="button_text"]').value,
        button_link: row.querySelector('[data-field="button_link"]').value,
        sort_order: parseInt(row.querySelector('[data-field="sort_order"]').value, 10),
        is_active: row.querySelector('[data-field="is_active"]').checked
      };

      const btn = row.querySelector('.hat-save-btn');
      btn.textContent = 'Saving...';
      btn.disabled = true;

      try {
        const res = await apiFetch(`/api/admin/carousel/${slideId}`, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        if (!res.ok) {
          const data = await res.json();
          throw new Error(data.detail || 'Could not save slide');
        }

        btn.textContent = 'Saved';
        setTimeout(() => { btn.textContent = 'Save'; btn.disabled = false; }, 1200);
        loadCarousel();
      } catch (err) {
        alert(err.message);
        btn.textContent = 'Save';
        btn.disabled = false;
      }
    }

    async function deleteSlide(slideId) {
      if (!confirm('Delete this carousel slide?')) return;

      const res = await apiFetch(`/api/admin/carousel/${slideId}`, { method: 'DELETE' });
      if (!res.ok) {
        alert('Could not delete slide.');
      }
      loadCarousel();
    }

    wireImageUpload({
      fileInput: document.getElementById('slideImageInput'),
      urlField: document.getElementById('slideImageUrl'),
      statusEl: document.getElementById('slideImageStatus'),
      previewEl: document.getElementById('slideImagePreview'),
    });

    const slideShowCaption = document.getElementById('slideShowCaption');
    const slideTitleInput = document.querySelector('#addSlideForm input[name="title"]');
    const slideCaptionLabels = [
      document.getElementById('slideTitleLabel'),
      document.getElementById('slideButtonTextLabel'),
      document.getElementById('slideButtonLinkLabel'),
    ];

    function syncSlideCaptionFields() {
      const showCaption = slideShowCaption.checked;
      slideCaptionLabels.forEach(label => { label.style.display = showCaption ? '' : 'none'; });
      slideTitleInput.required = showCaption;
    }

    slideShowCaption.addEventListener('change', syncSlideCaptionFields);
    syncSlideCaptionFields();

    document.getElementById('addSlideForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const form = e.target;
      const errorEl = document.getElementById('addSlideError');
      errorEl.style.display = 'none';

      const image_url = form.image_url.value.trim();
      const showCaption = form.show_caption.checked;
      const title = form.title.value.trim();

      if (!image_url) {
        errorEl.textContent = 'Please upload an image.';
        errorEl.style.display = 'block';
        return;
      }

      if (showCaption && !title) {
        errorEl.textContent = 'Title is required when the slide includes text.';
        errorEl.style.display = 'block';
        return;
      }

      const payload = {
        image_url,
        show_caption: showCaption,
        title: showCaption ? title : '',
        button_text: showCaption ? (form.button_text.value.trim() || 'Shop Now') : '',
        button_link: showCaption ? (form.button_link.value.trim() || '/showroom') : '',
        sort_order: parseInt(form.sort_order.value, 10) || 0,
        is_active: form.is_active.checked,
      };

      const submitBtn = form.querySelector('button[type="submit"]');
      submitBtn.disabled = true;
      submitBtn.textContent = 'Adding...';

      try {
        const res = await apiFetch('/api/admin/carousel', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        const data = await res.json();
        if (!res.ok) throw new Error(data.detail || 'Could not add slide');

        form.reset();
        form.is_active.checked = true;
        slideShowCaption.checked = true;
        syncSlideCaptionFields();
        document.getElementById('slideImageStatus').textContent = '';
        document.getElementById('slideImagePreview').style.display = 'none';
        loadCarousel();
      } catch (err) {
        errorEl.textContent = err.message;
        errorEl.style.display = 'block';
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Add Slide';
      }
    });

    loadOrders();
    loadHats();
    loadCarousel();
  </script>
</body>
</html>
