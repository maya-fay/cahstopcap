<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CahStopCap - Hat Details</title>
  <link rel="icon" type="image/png" href="/static/logo.png" />
  <link rel="apple-touch-icon" href="/static/logo.png" />
  <link rel="stylesheet" href="/static/styles.css?v=3" />
  <link rel="stylesheet" href="/static/showroom.css?v=2" />
  <link rel="stylesheet" href="/static/hat-detail.css?v=2" />
</head>
<body class="index">

  <!-- HEADER -->
  <header>
    <nav class="header-nav">
      <div class="nav-item">
        <span class="nav-text"><a href="/showroom">Shop</a></span>
        <span class="nav-icon"><a href="/showroom" aria-label="Shop"><svg class="nav-symbol" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 4h18l1.5 5h-21z"/><path d="M4 9v11h16V9"/><path d="M10 20v-6h4v6"/></svg></a></span>
      </div>
      <div class="nav-item">
        <span class="nav-text"><a href="/#about">About</a></span>
        <span class="nav-icon"><a href="/#about" aria-label="About"><svg class="nav-symbol" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v6"/><path d="M12 7.5v.5"/></svg></a></span>
      </div>
      <div class="nav-item">
        <span class="nav-text"><a href="/contact">Contact</a></span>
        <span class="nav-icon"><a href="/contact" aria-label="Contact"><svg class="nav-symbol" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14"/><path d="M3 6l9 7 9-7"/></svg></a></span>
      </div>
      <div class="nav-item">
        <span class="nav-text"><a href="/cart" class="nav-cart-link">Cart <span class="cart-count-badge">0</span></a></span>
        <span class="nav-icon"><a href="/cart" class="nav-cart-link" aria-label="Cart"><svg class="nav-symbol" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 3h3l2.5 12h11L21 7H6.2"/><circle cx="9" cy="19.5" r="1.5"/><circle cx="17" cy="19.5" r="1.5"/></svg><span class="cart-count-badge">0</span></a></span>
      </div>
    </nav>
    <div class="header-logo">
      <a href="/"><img src="/static/logo.png" alt="CahStopCap Logo"></a>
    </div>
  </header>

  <!-- MARQUEE -->
  <div class="marquee">
    <span> YDYS | YOU DEFINE YOUR SWAG | YDYS </span>
  </div>

  <!-- HAT DETAIL SECTION -->
  <section class="hat-detail-page">
    <div id="hatDetailContent">
      <p class="loading-state">Loading hat...</p>
    </div>
  </section>

  <!-- TOAST -->
  <div id="toast" class="toast"></div>

  <!-- FOOTER -->
  <footer>
    <div class="footer-info">
      <div>
        <h4>Find Us</h4>
        <p>Based in Kingston</p>
      </div>
      <div>
        <h4>Contact</h4>
        <div class="footer-social">
          <a href="mailto:cahstopcap@gmail.com" class="footer-icon-link" aria-label="Email us">
            <svg viewBox="0 0 24 24" class="email-icon" fill="none" xmlns="http://www.w3.org/2000/svg">
              <rect x="2" y="4" width="20" height="16" rx="2" stroke="white" stroke-width="1.6"/>
              <path d="M3 6.5L12 13L21 6.5" stroke="white" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </a>
          <a href="https://www.instagram.com/cahstopcap?igsh=MWJseGo2M2pxcWp1eg==" target="_blank" class="footer-icon-link">
            <img src="/static/assets/instagram.png" class="ig-logo" alt="Instagram" />
          </a>
        </div>
      </div>
    </div>
    <p class="footer-legal"><a href="/privacy">Privacy</a></p>
  </footer>

  <script src="/static/js/escape.js"></script>

  <script>
    function resolveImagePath(url) {
      if (!url) return '/static/assets/placeholder.jpg';
      if (url.startsWith('http') || url.startsWith('/')) return url;
      return '/' + url;
    }

    function getCart() {
      return JSON.parse(localStorage.getItem('cart') || '{}');
    }

    function saveCart(cart) {
      localStorage.setItem('cart', JSON.stringify(cart));
      updateCartBadge(cart);
    }

    function updateCartBadge(cart) {
      const count = Object.values(cart).reduce((sum, qty) => sum + qty, 0);
      document.querySelectorAll('.cart-count-badge').forEach(el => el.textContent = count);
    }

    function addToCart(hatId, stockQuantity) {
      const cart = getCart();
      const nextQty = (cart[hatId] || 0) + 1;
      const capped = nextQty > stockQuantity;
      cart[hatId] = Math.min(nextQty, stockQuantity);
      saveCart(cart);
      return capped ? 'capped' : 'added';
    }

    let toastTimeout;
    function showToast(message) {
      const toast = document.getElementById('toast');
      toast.textContent = message;
      toast.classList.add('show');
      clearTimeout(toastTimeout);
      toastTimeout = setTimeout(() => toast.classList.remove('show'), 2200);
    }

    function getHatIdFromPath() {
      const parts = window.location.pathname.split('/').filter(Boolean);
      return parts[parts.length - 1];
    }

    async function loadHatDetail() {
      const container = document.getElementById('hatDetailContent');
      const hatId = getHatIdFromPath();

      try {
        const res = await fetch(`/api/hats/${hatId}`);
        if (!res.ok) throw new Error('not found');
        const hat = await res.json();
        renderHatDetail(hat);
      } catch (err) {
        container.innerHTML = `
          <div class="hat-detail-notfound">
            <p>Sorry, we couldn't find that hat.</p>
            <a href="/showroom" class="button">Back to Shop</a>
          </div>
        `;
      }
    }

    function renderHatDetail(hat) {
      const container = document.getElementById('hatDetailContent');
      const outOfStock = hat.stock_quantity <= 0;

      const price = hat.price.toLocaleString('en-US', {
        style: 'currency',
        currency: 'USD',
        minimumFractionDigits: 0
      });

      container.innerHTML = `
        <div class="hat-detail-card">
          <div class="hat-detail-image ${outOfStock ? 'out-of-stock' : ''}">
            <img src="${escapeHtml(resolveImagePath(hat.image_url))}" alt="${escapeHtml(hat.name)}" />
            ${outOfStock ? '<span class="out-of-stock-badge">Out of Stock</span>' : ''}
          </div>
          <div class="hat-detail-info">
            <h2 class="hat-detail-name">${escapeHtml(hat.name)}</h2>
            <p class="hat-detail-price">${price}</p>
            <dl class="hat-detail-specs">
              ${hat.brand ? `<dt>Brand</dt><dd>${escapeHtml(hat.brand)}</dd>` : ''}
              ${hat.category ? `<dt>Category</dt><dd>${escapeHtml(hat.category)}</dd>` : ''}
            </dl>
            <button id="detailAddToCart" class="button add-to-cart-btn" ${outOfStock ? 'disabled' : ''}>
              ${outOfStock ? 'Out of Stock' : 'Add to Cart'}
            </button>
            <a href="/showroom" class="back-to-shop-link">&larr; Back to Shop</a>
          </div>
        </div>
      `;

      if (!outOfStock) {
        document.getElementById('detailAddToCart').addEventListener('click', () => {
          const result = addToCart(hat.id, hat.stock_quantity);
          if (result === 'capped') {
            showToast(`Only ${hat.stock_quantity} of "${hat.name}" in stock`);
          } else {
            showToast(`${hat.name} added to cart`);
          }
        });
      }
    }

    updateCartBadge(getCart());
    loadHatDetail();
  </script>
</body>
</html>
