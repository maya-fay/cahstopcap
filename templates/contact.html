<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CahStopCap - Contact</title>
  <link rel="icon" type="image/png" href="/static/logo.png" />
  <link rel="apple-touch-icon" href="/static/logo.png" />
  <link rel="stylesheet" href="/static/styles.css?v=2" />
  <link rel="stylesheet" href="/static/showroom.css?v=2" />
  <link rel="stylesheet" href="/static/contact.css?v=2" />
</head>
<body class="index">

  <!-- HEADER -->
  <header>
    <nav class="header-nav">
      <div class="nav-item">
        <span class="nav-text"><a href="/showroom">Shop</a></span>
        <span class="nav-icon"><a href="/showroom" aria-label="Shop"><svg class="nav-symbol" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 4h18l1.5 5h-21z"/><path d="M4 9v11h16V9"/><path d="M10 20v-6h4v6"/></svg></a></span>
      </div>
      <div class="nav-item">
        <span class="nav-text"><a href="/#about">About</a></span>
        <span class="nav-icon"><a href="/#about" aria-label="About"><svg class="nav-symbol" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v6"/><path d="M12 7.5v.5"/></svg></a></span>
      </div>
      <div class="nav-item">
        <span class="nav-text"><a href="/contact">Contact</a></span>
        <span class="nav-icon"><a href="/contact" aria-label="Contact"><svg class="nav-symbol" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14"/><path d="M3 6l9 7 9-7"/></svg></a></span>
      </div>
      <div class="nav-item">
        <span class="nav-text"><a href="/cart" class="nav-cart-link">Cart <span class="cart-count-badge">0</span></a></span>
        <span class="nav-icon"><a href="/cart" class="nav-cart-link" aria-label="Cart"><svg class="nav-symbol" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 3h3l2.5 12h11L21 7H6.2"/><circle cx="9" cy="19.5" r="1.5"/><circle cx="17" cy="19.5" r="1.5"/></svg><span class="cart-count-badge">0</span></a></span>
      </div>
    </nav>
    <div class="header-logo">
      <a href="/"><img src="/static/logo.png" alt="CahStopCap Logo"></a>
    </div>
  </header>

  <!-- MARQUEE -->
  <div class="marquee">
    <span> YDYS | YOU DEFINE YOUR SWAG | YDYS </span>
  </div>

  <!-- CONTACT SECTION -->
  <section class="contact-page">
    <h2 class="showroom-header">CONTACT</h2>
    <p class="contact-intro">Questions about a hat, an order or a collab? Reach out.</p>

    <div class="contact-cards">
      <a class="contact-card" href="mailto:cahstopcap@gmail.com">
        <svg class="nav-symbol contact-card-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14"/><path d="M3 6l9 7 9-7"/></svg>
        <h3>Email</h3>
        <p>cahstopcap@gmail.com</p>
      </a>

      <a class="contact-card" href="https://www.instagram.com/cahstopcap?igsh=MWJseGo2M2pxcWp1eg==" target="_blank" rel="noopener">
        <img src="/static/assets/instagram.png" class="contact-card-icon contact-card-img" alt="" />
        <h3>Instagram</h3>
        <p>DM us @cahstopcap</p>
      </a>

      <div class="contact-card">
        <svg class="nav-symbol contact-card-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-7-6.5-7-12a7 7 0 0 1 14 0c0 5.5-7 12-7 12z"/><circle cx="12" cy="9" r="2.5"/></svg>
        <h3>Find Us</h3>
        <p>Based in Kingston</p>
      </div>
    </div>
  </section>

  <script>
    const cart = JSON.parse(localStorage.getItem('cart') || '{}');
    const count = Object.values(cart).reduce((sum, qty) => sum + qty, 0);
    document.querySelectorAll('.cart-count-badge').forEach(el => el.textContent = count);
  </script>
</body>
</html>
